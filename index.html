<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hari Graduasi Tadika Inspirasi 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Ambient Layers -->
  <div class="garden-bg"></div>
  <div class="sunbeam"></div>
  <div id="particle-layer"></div>
  <div id="butterfly-layer"></div>

  <!-- Top-Left Botanical SVG -->
  <svg class="corner-flora-tl" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M-10 180 C60 150, 120 90, 175 10" stroke="#7BA38E" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M20 240 C85 185, 115 120, 135 45" stroke="#94B8A4" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="68" cy="142" rx="22" ry="11" transform="rotate(-38 68 142)" fill="#A8CEB9" opacity="0.85"/>
    <ellipse cx="118" cy="96" rx="20" ry="10" transform="rotate(-48 118 96)" fill="#89B59E" opacity="0.85"/>
    <ellipse cx="152" cy="48" rx="18" ry="9" transform="rotate(-55 152 48)" fill="#B8D8C6" opacity="0.9"/>
    <ellipse cx="88" cy="182" rx="19" ry="9.5" transform="rotate(15 88 182)" fill="#9BC4AE" opacity="0.8"/>
    <!-- Blossom 1 -->
    <g transform="translate(52, 58)">
      <circle cx="0" cy="-22" r="16" fill="#F6C3D4" opacity="0.9"/>
      <circle cx="21" cy="-7" r="16" fill="#F9D5E1" opacity="0.9"/>
      <circle cx="13" cy="18" r="16" fill="#F4B6CB" opacity="0.9"/>
      <circle cx="-13" cy="18" r="16" fill="#F9D5E1" opacity="0.9"/>
      <circle cx="-21" cy="-7" r="16" fill="#F6C3D4" opacity="0.9"/>
      <circle cx="0" cy="0" r="10" fill="#F7D774"/>
    </g>
    <!-- Blossom 2 -->
    <g transform="translate(128, 36) scale(0.75)">
      <circle cx="0" cy="-20" r="15" fill="#FBE3EB"/>
      <circle cx="19" cy="-6" r="15" fill="#F6C3D4"/>
      <circle cx="12" cy="16" r="15" fill="#FBE3EB"/>
      <circle cx="-12" cy="16" r="15" fill="#F6C3D4"/>
      <circle cx="-19" cy="-6" r="15" fill="#FBE3EB"/>
      <circle cx="0" cy="0" r="9" fill="#E9B949"/>
    </g>
  </svg>

  <!-- Bottom-Right Botanical SVG -->
  <svg class="corner-flora-br" viewBox="0 0 320 320" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M330 130 C255 165, 195 225, 140 310" stroke="#7BA38E" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M295 75 C235 135, 200 205, 185 285" stroke="#94B8A4" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="248" cy="175" rx="24" ry="12" transform="rotate(-38 248 175)" fill="#A8CEB9" opacity="0.85"/>
    <ellipse cx="196" cy="226" rx="21" ry="10.5" transform="rotate(-48 196 226)" fill="#89B59E" opacity="0.85"/>
    <ellipse cx="222" cy="135" rx="19" ry="9.5" transform="rotate(18 222 135)" fill="#B8D8C6" opacity="0.85"/>
    <!-- Blossom -->
    <g transform="translate(262, 255) scale(1.15)">
      <circle cx="0" cy="-22" r="16" fill="#F4B6CB" opacity="0.9"/>
      <circle cx="21" cy="-7" r="16" fill="#F9D5E1" opacity="0.9"/>
      <circle cx="13" cy="18" r="16" fill="#F6C3D4" opacity="0.9"/>
      <circle cx="-13" cy="18" r="16" fill="#F9D5E1" opacity="0.9"/>
      <circle cx="-21" cy="-7" r="16" fill="#F4B6CB" opacity="0.9"/>
      <circle cx="0" cy="0" r="10" fill="#F7D774"/>
    </g>
  </svg>

  <!-- Edit Mode Top Banner -->
  <div id="edit-banner" class="hidden fixed top-4 left-1/2 -translate-x-1/2 z-50 flex items-center gap-3 bg-white/95 backdrop-blur-md border border-rose-200 px-5 py-2.5 rounded-full shadow-lg">
    <span class="text-xs font-bold uppercase tracking-wider text-rose-700 flex items-center gap-1.5">
      <i class="fa-solid fa-pen-to-square"></i> Mod Suntingan Aktif
    </span>
    <span class="text-xs text-stone-500 hidden sm:inline">| Klik teks untuk taip nama, klik bingkai foto untuk muat naik gambar</span>
    <button onclick="downloadSavedData()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3.5 py-1.5 rounded-full transition flex items-center gap-1.5 shadow-sm">
      <i class="fa-solid fa-download"></i> Muat Turun script.js Tersimpan
    </button>
    <button onclick="resetAllEdits()" class="bg-stone-100 hover:bg-stone-200 text-stone-700 text-xs font-semibold px-3 py-1.5 rounded-full transition">
      Reset
    </button>
  </div>

  <!-- Hidden File Input for Photo Uploads -->
  <input type="file" id="photo-uploader" accept="image/*" class="hidden" />

  <!-- Main Stage -->
  <main id="stage"></main>

  <!-- Quick Jump Drawer -->
  <div id="slide-drawer" class="hidden">
    <div class="flex items-center justify-between pb-3 mb-3 border-b border-stone-200">
      <h3 class="font-bold text-sm text-stone-800"><i class="fa-solid fa-list-ul mr-2 text-rose-600"></i>Senarai Semua Slaid (76 Slaid)</h3>
      <button onclick="toggleDrawer()" class="text-stone-400 hover:text-stone-700 text-sm px-2"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="drawer-list" class="grid grid-cols-1 sm:grid-cols-2 gap-1.5 text-left text-xs"></div>
  </div>

  <!-- Single Floating Control Bar -->
  <div id="control-bar">
    <button onclick="prevSlide()" title="Slaid Sebelum (Arrow Kiri)" class="w-9 h-9 rounded-full hover:bg-rose-50 text-stone-700 flex items-center justify-center transition">
      <i class="fa-solid fa-chevron-left"></i>
    </button>

    <button onclick="toggleDrawer()" title="Pilih Slaid" class="px-3 py-1.5 rounded-full hover:bg-rose-50 text-xs font-bold text-stone-700 flex items-center gap-2 transition">
      <span id="slide-counter">1 / 76</span>
      <i class="fa-solid fa-bars text-rose-500"></i>
    </button>

    <button onclick="nextSlide()" title="Slaid Seterusnya (Arrow Kanan / Space)" class="w-9 h-9 rounded-full hover:bg-rose-50 text-stone-700 flex items-center justify-center transition">
      <i class="fa-solid fa-chevron-right"></i>
    </button>

    <div class="h-5 w-px bg-stone-200 mx-1"></div>

    <button onclick="triggerConfetti()" title="Letusan Konfeti (Kekunci C)" class="px-3 py-1.5 rounded-full bg-amber-50 hover:bg-amber-100 text-amber-800 text-xs font-semibold flex items-center gap-1.5 transition">
      <i class="fa-solid fa-sparkles text-amber-500"></i> <span class="hidden md:inline">Konfeti</span>
    </button>

    <button onclick="spawnExtraButterfly()" title="Tambah Rama-rama (Kekunci B)" class="px-3 py-1.5 rounded-full bg-emerald-50 hover:bg-emerald-100 text-emerald-800 text-xs font-semibold flex items-center gap-1.5 transition">
      <i class="fa-solid fa-feather-pointed text-emerald-600"></i> <span class="hidden md:inline">Rama-rama</span>
    </button>

    <!-- Butang Muzik VIP -->
    <button onclick="toggleBgm('vip')" id="btn-bgm-vip" class="px-3 py-1.5 rounded-full bg-emerald-50 hover:bg-emerald-100 text-emerald-800 text-xs font-bold transition inline-flex items-center gap-1.5">
      <i class="fa-solid fa-music"></i> VIP
    </button>

    <!-- Butang Muzik Perarakan -->
    <button onclick="toggleBgm('perarakan')" id="btn-bgm-perarakan" class="px-3 py-1.5 rounded-full bg-purple-50 hover:bg-purple-100 text-purple-800 text-xs font-bold transition inline-flex items-center gap-1.5">
      <i class="fa-solid fa-music"></i> Perarakan
    </button>

    <!-- Butang Muzik Penyampaian Hadiah -->
    <button onclick="toggleBgm('hadiah')" id="btn-bgm-hadiah" class="px-3 py-1.5 rounded-full bg-amber-50 hover:bg-amber-100 text-amber-800 text-xs font-bold transition inline-flex items-center gap-1.5 whitespace-nowrap">
      <i class="fa-solid fa-music"></i> Hadiah
    </button>

    <!-- Butang Muzik Bapa -->
    <button onclick="toggleBgm('bapa')" id="btn-bgm-bapa" class="px-3 py-1.5 rounded-full bg-sky-50 hover:bg-sky-100 text-sky-800 text-xs font-bold transition inline-flex items-center gap-1.5 whitespace-nowrap">
      <i class="fa-solid fa-music"></i> Bapa
    </button>

    
    <!-- Butang Muzik Restu -->
    <button onclick="toggleBgm('restu')" id="btn-bgm-restu" class="px-3 py-1.5 rounded-full bg-rose-50 hover:bg-rose-100 text-rose-800 text-xs font-bold transition inline-flex items-center gap-1.5 whitespace-nowrap">
      <i class="fa-solid fa-music"></i> Restu
    </button>


    <button id="btn-edit-mode" onclick="toggleEditMode()" title="Sunting Nama & Gambar" class="px-3 py-1.5 rounded-full bg-rose-50 hover:bg-rose-100 text-rose-800 text-xs font-semibold flex items-center gap-1.5 transition">
      <i class="fa-solid fa-pen"></i> <span class="hidden md:inline">Sunting</span>
    </button>

    <button onclick="toggleHideBar()" title="Sorok Bar (Kekunci H)" class="w-9 h-9 rounded-full hover:bg-stone-100 text-stone-600 flex items-center justify-center transition">
      <i class="fa-solid fa-eye-slash"></i>
    </button>

    <button onclick="toggleFullscreen()" title="Skrin Penuh Projektor (Kekunci F)" class="w-9 h-9 rounded-full hover:bg-stone-100 text-stone-700 flex items-center justify-center transition">
      <i class="fa-solid fa-expand"></i>
    </button>
  </div>

  <script src="script.js"></script>

 <audio id="bgm-vip" src="audio/vip.mp3" loop></audio>
 <audio id="bgm-perarakan" src="audio/perarakan.mp3" loop></audio> 
 <audio id="bgm-hadiah" src="audio/hadiah.mp3" loop></audio>
 <audio id="bgm-restu" src="audio/restu.mp3" loop></audio>
<audio id="bgm-bapa" src="audio/bapa.mp3" loop></audio>
</body>
</html>
